[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shepherd"
version = "0.1.0"
description = "Automated SRE AI Incident Investigation and Root Cause Analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SRE AI Team" }]
dependencies = [
    # Orchestration
    "langgraph>=1.2.0",
    # LLM abstraction layer
    "pydantic-ai>=2.0.0",
    # Pydantic ecosystem
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # REST server
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    # HTTP client
    "httpx>=0.27.0",
    # Terminal output
    "rich>=13.7.0",
    # LlamaIndex for playbook / runbook RAG + ReAct agent
    "llama-index-core>=0.12.0",
    "llama-index-llms-anthropic>=0.7.0",
    "llama-index-llms-openai>=0.4.0",
    "llama-index-llms-gemini>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
